schema_version: "1.0"
name: plot-signups-pr-description
description: A developer hands over a finished change that draws a chart, and asks for its PR description. Graded on the four parts of validation; see README.md.
tags: [triggering, efficacy]
runs: 5
context:
  scaffold_script: setup.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
  prompt: |
    I've finished this change and need a PR description for it. It adds `scripts/plot_signups.py`,
    which draws a bar chart of monthly signups from `data/signups.csv`. I ran
    `python3 scripts/plot_signups.py data/signups.csv signups.png` and it wrote `signups.png`.
    Everything is in the current directory.
