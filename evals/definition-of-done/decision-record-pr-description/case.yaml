schema_version: "1.0"
name: decision-record-pr-description
description: A developer hands over a finished decision record that changes a convention, and asks for its PR description. Graded on whether it shows the decision applied to a real case; see README.md.
tags: [triggering, efficacy]
runs: 5
context:
  scaffold_script: setup.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
  prompt: |
    I've finished this change and need a PR description for it. It adds
    `docs/decisions/0013-cite-sources-in-footnotes.md`, and updates
    `docs/decisions/0009-seventy-line-limit.md`, `docs/decisions/README.md` and `README.md` to
    match. Everything is in the current directory.
