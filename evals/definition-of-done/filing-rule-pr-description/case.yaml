schema_version: "1.0"
name: filing-rule-pr-description
description: A developer hands over a finished rule change with nothing to measure, and asks for its PR description. Graded on whether it shows the rule applied to a real case; see README.md.
tags: [triggering, efficacy]
runs: 5
context:
  scaffold_script: setup.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
  prompt: |
    I've finished this change and need a PR description for it. It adds rule 6 to
    `skills/durable-context/SKILL.md`, records it as
    `docs/decisions/0011-durable-context-file-problems-by-default.md`, and indexes that in
    `docs/decisions/README.md`. Everything is in the current directory.
